<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | AquaTrack</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body ><div id="nav"></div>
<main class="container py-4"><h2 class="mb-4">Profile and settings</h2><div class="row g-4">
<div class="col-lg-6"><form name="pf" class="card-stat p-4" novalidate><h5>Your details</h5><div class="mb-3"><label class="form-label">Email</label><input name="email" class="form-control" disabled></div>
<div class="mb-3"><label class="form-label">Full name</label><input name="name" class="form-control" required minlength="2" maxlength="60"><div class="invalid-feedback">Enter 2-60 characters.</div></div>
<div class="mb-3"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2" maxlength="200"></textarea></div><button class="btn btn-water">Save changes</button></form></div>
<div class="col-lg-6"><form name="gl" class="card-stat p-4 mb-4" novalidate><h5>Conservation goal</h5><div class="row"><div class="col-6 mb-3"><label class="form-label">Daily (L)</label><input type="number" name="targetDailyLitres" class="form-control" min="1" max="100000" required></div>
<div class="col-6 mb-3"><label class="form-label">Monthly (L)</label><input type="number" name="targetMonthlyLitres" class="form-control" min="1" max="3000000" required></div></div><button class="btn btn-water">Save goal</button></form>
<form name="pw" class="card-stat p-4" novalidate><h5>Change password</h5><div class="mb-3"><label class="form-label">Current password</label><input type="password" name="currentPassword" class="form-control" required></div>
<div class="mb-3"><label class="form-label">New password</label><input type="password" name="newPassword" class="form-control" required minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"><div class="invalid-feedback">8+ characters with a letter and a number.</div></div><button class="btn btn-water">Update password</button></form></div></div>
<button id="lo" class="btn btn-outline-danger mt-4"><i class="bi bi-box-arrow-right"></i> Log out</button></main>
<footer id="footer"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="/js/app.js"></script><script src="/js/profile.js"></script></body></html>
