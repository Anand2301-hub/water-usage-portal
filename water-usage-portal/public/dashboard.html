<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | AquaTrack</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body ><div id="nav"></div>
<main class="container py-4"><h2 class="mb-4">Your water dashboard</h2>
<div class="row g-3 mb-4" id="cards"><div class="spin"><div class="spinner-border text-info"></div></div></div>
<div class="row g-3 mb-4"><div class="col-lg-8"><div class="card-stat p-4"><h5>Last 30 days</h5><canvas id="trend" height="110"></canvas></div></div>
<div class="col-lg-4"><div class="card-stat p-4 h-100"><h5>Monthly goal</h5><div class="progress my-3" style="height:14px"><div id="bar" class="progress-bar" role="progressbar"></div></div><p id="goalTxt" class="mb-4"></p><h5>Suggestions</h5><ul id="sug" class="ps-3 mb-0"></ul></div></div></div>
<div class="card-stat p-4 mb-4"><h5>Smart insights</h5><div id="ins" class="row g-3"></div></div>
<div class="card-stat"><div class="p-3 d-flex justify-content-between"><h5 class="mb-0">Recent records</h5><a href="/usage.html">View all</a></div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Date</th><th>Category</th><th>Litres</th></tr></thead><tbody id="recent"></tbody></table></div></div></main>
<footer id="footer"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="/js/app.js"></script><script src="/js/dashboard.js"></script></body></html>
