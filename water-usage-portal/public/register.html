<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | AquaTrack</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body data-auth="no"><div id="nav"></div>
<main class="container auth-wrap"><div class="card-stat p-4 p-md-5 w-100" style="max-width:520px"><h3 class="mb-1">Create your account</h3><p class="text-secondary">Start tracking your water use.</p><div id="msg"></div>
<form id="register" novalidate><div class="mb-3"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" required minlength="2" maxlength="60"><div class="invalid-feedback">Enter 2-60 characters.</div></div>
<div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" required maxlength="100"><div class="invalid-feedback">Enter a valid email.</div></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required minlength="8" maxlength="64" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"><div class="invalid-feedback">8+ characters with a letter and a number.</div></div>
<div class="col-md-6 mb-3"><label class="form-label" for="confirmPassword">Confirm password</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" required><div class="invalid-feedback">Passwords must match.</div></div></div>
<div class="mb-4"><label class="form-label" for="address">Address <span class="text-secondary">(optional)</span></label><textarea class="form-control" id="address" name="address" rows="2" maxlength="200"></textarea></div>
<button class="btn btn-water w-100 py-2">Create account</button></form><p class="mt-3 mb-0 text-center">Already registered? <a href="/login.html">Log in</a></p></div></main>
<footer id="footer"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="/js/app.js"></script><script src="/js/auth.js"></script></body></html>
