<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usage | AquaTrack</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body ><div id="nav"></div>
<main class="container py-4"><div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2"><div><h2 class="mb-0">Water usage</h2><small class="text-secondary">Add, search, filter and manage your records</small></div><button id="addBtn" class="btn btn-water"><i class="bi bi-plus-lg"></i> Add usage</button></div>
<form name="filters" class="card-stat p-3 mb-3"><div class="row g-2"><div class="col-md-3"><input name="q" class="form-control" placeholder="Search notes" aria-label="Search notes"></div>
<div class="col-md-2"><select name="category" class="form-select cat" aria-label="Category"><option value="">All categories</option></select></div>
<div class="col-md-2"><input type="date" name="from" class="form-control" aria-label="From date"></div><div class="col-md-2"><input type="date" name="to" class="form-control" aria-label="To date"></div>
<div class="col-md-2"><select name="sort" class="form-select" aria-label="Sort"><option value="usageDate:desc">Newest first</option><option value="usageDate:asc">Oldest first</option><option value="quantityLitres:desc">Most litres</option><option value="quantityLitres:asc">Fewest litres</option></select></div>
<div class="col-md-1 d-grid"><button class="btn btn-water" aria-label="Apply filters"><i class="bi bi-search"></i></button></div></div></form>
<div class="card-stat"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Date</th><th>Category</th><th>Litres</th><th>Notes</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5"><div class="spin"><div class="spinner-border text-info"></div></div></td></tr></tbody></table></div>
<div id="empty" class="text-center p-5 d-none"><i class="bi bi-droplet fs-1 text-info"></i><p class="mb-0">No records match. Add usage or clear the filters.</p></div>
<nav class="p-3" aria-label="Pages"><ul id="pager" class="pagination pagination-sm mb-0 justify-content-center"></ul></nav></div></main>
<div class="modal fade" id="uModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form name="u" class="modal-content" novalidate><div class="modal-header"><h5 id="mTitle" class="modal-title">Add usage</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
<div class="modal-body"><div id="smartBox" class="mb-3 p-3 rounded" style="background:var(--mist)"><label class="form-label">Smart entry <span class="text-secondary">(optional)</span></label><div class="input-group"><input id="smartTxt" class="form-control" placeholder="e.g. 10 minute shower" maxlength="200"><button type="button" id="smartBtn" class="btn btn-water">Fill</button></div></div><div class="mb-3"><label class="form-label">Date</label><input type="date" name="usageDate" class="form-control" required><div class="invalid-feedback">Pick a date that is not in the future.</div></div>
<div class="mb-3"><label class="form-label">Category</label><select name="category" class="form-select cat" required><option value="">Choose...</option></select><div class="invalid-feedback">Choose a category.</div></div>
<div class="mb-3"><label class="form-label">Quantity (litres)</label><input type="number" name="quantityLitres" class="form-control" step="0.1" min="0.1" max="100000" required><div class="invalid-feedback">Enter a quantity above 0.</div></div>
<div><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2" maxlength="300"></textarea></div></div>
<div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button><button id="saveBtn" class="btn btn-water">Save record</button></div></form></div></div>
<footer id="footer"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="/js/app.js"></script><script src="/js/usage.js"></script></body></html>
