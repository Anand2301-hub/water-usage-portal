<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | AquaTrack</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body data-admin="yes"><div id="nav"></div>
<main class="container py-4"><h2 class="mb-4">Administrator dashboard</h2><div class="row g-3 mb-4" id="cards"><div class="spin"><div class="spinner-border text-info"></div></div></div>
<div class="row g-3 mb-4"><div class="col-lg-6"><div class="card-stat p-4"><h5>Usage by category</h5><canvas id="c1" height="200"></canvas></div></div><div class="col-lg-6"><div class="card-stat p-4"><h5>Monthly consumption</h5><canvas id="c2" height="200"></canvas></div></div></div>
<div class="card-stat mb-4"><h5 class="p-3 mb-0">Registered users</h5><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th></th></tr></thead><tbody id="users"></tbody></table></div></div>
<div class="card-stat"><h5 class="p-3 mb-0">Latest usage records</h5><div class="table-responsive"><table class="table mb-0"><thead><tr><th>User</th><th>Date</th><th>Category</th><th>Litres</th></tr></thead><tbody id="usage"></tbody></table></div></div></main>
<footer id="footer"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="/js/app.js"></script><script src="/js/admin.js"></script></body></html>
