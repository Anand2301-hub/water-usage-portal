<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Coach | AquaTrack</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body ><div id="nav"></div>
<main class="container py-4" style="max-width:760px"><h2 class="mb-1">AI water coach</h2><p class="text-secondary">Answers are based on your own last 14 days of records.</p>
<div class="d-flex flex-wrap gap-2 mb-3"><button class="btn btn-sm btn-outline-info" data-q="Where am I using the most water?">Where do I use most?</button><button class="btn btn-sm btn-outline-info" data-q="How can I stay under my daily target?">Stay under target</button><button class="btn btn-sm btn-outline-info" data-q="Give me 3 quick actions to save water this week.">3 quick actions</button></div>
<div class="card-stat"><div id="log" class="chat" aria-live="polite"></div><form id="cf" class="p-3 border-top d-flex gap-2"><input id="q" class="form-control" placeholder="Ask about your water use" maxlength="300" aria-label="Question"><button class="btn btn-water"><i class="bi bi-send"></i></button></form></div></main>
<footer id="footer"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script><script src="/js/coach.js"></script></body></html>
