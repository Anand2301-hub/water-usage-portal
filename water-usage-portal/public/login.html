<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | AquaTrack</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body data-auth="no"><div id="nav"></div>
<main class="container auth-wrap"><div class="card-stat p-4 p-md-5 w-100" style="max-width:440px"><h3 class="mb-1">Welcome back</h3><p class="text-secondary">Log in to see your water dashboard.</p><div id="msg"></div>
<form id="login" novalidate><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" required maxlength="100" autocomplete="email"><div class="invalid-feedback">Enter a valid email.</div></div>
<div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"><div class="invalid-feedback">Password is required.</div></div>
<button class="btn btn-water w-100 py-2">Log in</button></form><p class="mt-3 mb-0 text-center">New here? <a href="/register.html">Create an account</a></p></div></main>
<footer id="footer"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="/js/app.js"></script><script src="/js/auth.js"></script></body></html>
