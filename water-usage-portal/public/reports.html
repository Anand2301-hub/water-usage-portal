<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | AquaTrack</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body ><div id="nav"></div>
<main class="container py-4"><h2 class="mb-4">Reports and analytics</h2>
<div class="row g-3 mb-4" id="sum"><div class="spin"><div class="spinner-border text-info"></div></div></div>
<div class="row g-3 mb-4"><div class="col-lg-6"><div class="card-stat p-4"><h5>Usage by category</h5><canvas id="catChart" height="200"></canvas></div></div>
<div class="col-lg-6"><div class="card-stat p-4"><h5>Daily trend vs target</h5><canvas id="trChart" height="200"></canvas></div></div></div>
<form name="ex" class="card-stat p-3"><h5>Export records to CSV</h5><div class="row g-2 align-items-end"><div class="col-md-3"><label class="form-label">Category</label><select name="category" class="form-select cat"><option value="">All</option></select></div>
<div class="col-md-3"><label class="form-label">From</label><input type="date" name="from" class="form-control"></div><div class="col-md-3"><label class="form-label">To</label><input type="date" name="to" class="form-control"></div>
<div class="col-md-3 d-grid"><button class="btn btn-water"><i class="bi bi-download"></i> Download CSV</button></div></div></form></main>
<footer id="footer"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="/js/app.js"></script><script src="/js/reports.js"></script></body></html>
